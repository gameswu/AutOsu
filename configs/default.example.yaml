# AutOsu configuration example
# Pass with: python scripts/run.py play -c config.yaml

detector_path: "runs/detect/train/weights/best.pt"
device: "cuda:0"
use_tensorrt: false

conf_threshold: 0.3
iou_threshold: 0.45
model_input_w: 640
model_input_h: 384
use_dxcam: true

target_fps: 120

# Controller (key-press timing — rule-based)
hit_window: 0.90
tap_hold_ms: 40.0
tap_refractory_ms: 70.0
slide_grace_ms: 90.0
spin_grace_ms: 120.0

# Trajectory model (learned cursor motion)
# motion_net_path: "runs/motion/trajectory.pt"

# Motion training (scripts/train_motion.py -c config.yaml)
motion_training:
  dataset: "runs/motion/dataset.npz"
  output: "runs/motion/trajectory.pt"
  epochs: 60
  batch_size: 4096
  lr: 0.001
  val_frac: 0.1

# Data generation
data:
  raw_data_dir: "raw_data"
  skin_dir: "path/to/osu/skin"
  output_dir: "dataset"
  render_width: 640
  render_height: 384
  fps: 30
  max_beatmaps: 100
  train_ratio: 0.85
  seed: 42

# osu! API (for scripts/collect_data.py)
osu_api:
  client_id: ~
  client_secret: ~
  osu_session: ~
