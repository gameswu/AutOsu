# AutOsu default configuration
# Copy this file and modify for your setup.

# ── Model paths ──────────────────────────────────────────────────────────
detector_path: "runs/detect/train/weights/best.pt"

# ── Device ───────────────────────────────────────────────────────────────
device: "cuda:0"
use_tensorrt: false

# ── Detection ────────────────────────────────────────────────────────────
conf_threshold: 0.3
iou_threshold: 0.45
model_input_w: 640
model_input_h: 384

# ── Capture ──────────────────────────────────────────────────────────────
use_dxcam: true   # fall back to mss if unavailable

# ── Runtime ──────────────────────────────────────────────────────────────
target_fps: 120

# ── Controller (vision-only CPRP player) ─────────────────────────────────
hit_window: 0.90        # tap once approach_ratio >= this
hit_radius_osu: 80.0    # cursor must be within this of the target to tap
tap_hold_ms: 40.0       # how long a tap key stays held
spin_radius_osu: 60.0   # spinner sweep radius
motion_jitter: 1.2      # peak human-like jitter amplitude (osu!px)
# Optional baked human-motion profile from scripts/analyze_motion.py.
# When set, overrides motion_jitter and supplies overshoot / follow_alpha /
# tap_lead_ms learned offline from real replays. Leave unset for built-in defaults.
# motion_profile_path: "configs/motion_profile.yaml"
# Optional learned residual weights from scripts/train_motion.py. When set and
# loadable, the CPRP residual layer shapes cursor motion on top of the
# deterministic reference (cursor = reference + gate*residual). Without it the
# controller runs as the pure deterministic reference. When active, the hand-made
# jitter/overshoot are disabled (the net supplies human deviation instead).
# motion_net_path: "runs/motion/motion_net.pt"
# max_residual_osu: 20.0  # hard cap on the learned cursor offset (osu!px)

# ── Data generation (used by scripts/generate_dataset.py) ────────────────
data:
  raw_data_dir: "raw_data"   # contains beatmaps/ and replays/ subdirectories
  skin_dir: "path/to/osu/skin"
  output_dir: "dataset"
  render_width: 640
  render_height: 384
  fps: 30
  max_beatmaps: 100
  train_ratio: 0.85
  seed: 42

# ── osu! API credentials (used by scripts/collect_data.py) ──────────────
# Register at: https://osu.ppy.sh/home/account/edit -> "New OAuth Application"
# IMPORTANT: Set callback URL to http://localhost:7272/callback
osu_api:
  client_id: ~       # integer, e.g. 12345
  client_secret: ~   # string, e.g. "abcdef123456"
  osu_session: ~         # string, paste from F12 -> Application -> Cookies
