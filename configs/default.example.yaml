# AutOsu configuration example
# Pass with: python scripts/run.py play -c config.yaml

detector_path: "runs/detect/train/weights/best.pt"
device: "cuda:0"
use_tensorrt: false

conf_threshold: 0.3
iou_threshold: 0.45
model_input_w: 640
model_input_h: 384
use_dxcam: true

target_fps: 120

# Controller
hit_window: 0.90
tap_hold_ms: 40.0
tap_refractory_ms: 70.0
spin_radius_osu: 60.0
spin_speed: 0.025
slide_follow_radius_osu: 120.0
slide_grace_ms: 90.0
spin_grace_ms: 120.0
max_speed_osu_pms: 3.0
max_accel_osu_pms2: 0.20
seek_tau_ms: 45.0

# Aim-point offset: fraction of hit-circle radius to shift toward next target.
# Higher = more aggressive corner-cutting. Hit radius is auto-estimated from
# detection boxes.
aim_cut_fraction: 0.65
lookahead_n: 3

# Style residual (optional, leave unset for pure seek)
# motion_net_path: "runs/motion/motion_net.pt"
max_residual_osu_pms: 1.5
style_scale: 1.0

# Data generation
data:
  raw_data_dir: "raw_data"
  skin_dir: "path/to/osu/skin"
  output_dir: "dataset"
  render_width: 640
  render_height: 384
  fps: 30
  max_beatmaps: 100
  train_ratio: 0.85
  seed: 42

# osu! API (for scripts/collect_data.py)
osu_api:
  client_id: ~
  client_secret: ~
  osu_session: ~
