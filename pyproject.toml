[project]
name = "autOsu"
version = "0.2.0"
description = "Vision-based osu! std AI player — YOLO + approach estimator + GRU action model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "torch==2.3.1+cu121",
    "torchvision==0.18.1+cu121",
    "ultralytics==8.2.103",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "osrparse>=6.0",
]

[project.optional-dependencies]
capture = ["dxcam>=0.0.5", "mss>=9.0"]

[project.scripts]
autosu-run = "scripts.run:main"
autosu-generate = "scripts.generate_dataset:main"
autosu-train-detect = "scripts.train_detector:main"
autosu-train-action = "scripts.train_action:main"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
